<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A poker trainer for friends: play hands and tournaments against bots and each other, with every decision explained.">
<title>Poker Angel Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One deliberate dark world (a card room at night): the felt table needs it, so no light theme.
     Layout: brand bar, then the trainer — table and drills on the left, the coach's notes on the right
     (stacked under it on narrow screens). */
  :root{
    --bg:#0f172a; --panel:#111c33; --panel2:#0c1628; --border:#1e293b; --text:#e2e8f0;
    --muted:#94a3b8; --brand:#3B82F6; --gold:#fbbf24; --green:#059669; --rose:#e11d48;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:13px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
  /* Buttons: soft depth, a lift on hover, colour by job — green goes ahead, blue acts, amber sizes a
     raise, red folds, quiet outline for everything secondary. */
  button{font-family:inherit;cursor:pointer;border:1px solid transparent;border-radius:11px;font-weight:650;font-size:12.5px;letter-spacing:.01em;padding:8px 14px;color:#fff;
    background:linear-gradient(180deg,#4f8ff7,#2563eb);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px -8px rgba(37,99,235,.8);
    transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease,border-color .12s ease,filter .12s ease}
  button:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 22px -10px rgba(37,99,235,.9)}
  button:active{transform:translateY(0);filter:brightness(.97)}
  button:disabled{opacity:.45;cursor:default;transform:none}
  button.ghost{background:rgba(148,163,184,.07);border-color:rgba(148,163,184,.22);color:#dbe4f0;box-shadow:none}
  button.ghost:hover{background:rgba(148,163,184,.14);border-color:rgba(148,163,184,.4);box-shadow:none}
  button.primary{background:linear-gradient(180deg,#22c58b,#059669);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 16px -8px rgba(5,150,105,.9)}
  button.fold{background:linear-gradient(180deg,#f0646a,#c62828);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px -8px rgba(198,40,40,.85)}
  button.raise{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.45);color:#fcd38a;box-shadow:none}
  button.raise:hover{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.7)}
  @media (prefers-reduced-motion: reduce){ button{transition:none} button:hover{transform:none} }
  input,select,textarea{font-family:inherit;font-size:12.5px;width:100%;background:#0c1628;border:1px solid rgba(148,163,184,.22);color:var(--text);border-radius:10px;padding:8px 10px;outline:none}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  input:focus,select:focus{border-color:var(--brand)}
  input[type=checkbox],input[type=range]{width:auto}
  a{color:#93c5fd}
  .top{display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid #1d2c46;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:.01em}
  .brand .mk{width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,#fcd34d,#b45309);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brand .mk svg{width:20px;height:20px}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  /* ---- trainer view ---- */
  #trainer{position:relative;min-height:calc(100% - 58px);display:none;flex-direction:column;background:radial-gradient(1100px 700px at 50% 22%,#13203a,#0a1120 74%)}
  #trainer.show{display:flex}
  .tr-head{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid #1c2942;flex-wrap:wrap}
  .tr-head .ttl{font-weight:800;font-size:15px}
  .tr-head .ttl small{display:block;font-weight:500;color:#8ea2bd;font-size:11px}
  .tr-tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;background:rgba(148,163,184,.06);border:1px solid rgba(148,163,184,.14);border-radius:13px;padding:3px}
  .tr-tabs button{padding:6px 12px;font-size:12px;border-radius:10px;background:transparent;border-color:transparent;color:#a9b8cc;box-shadow:none}
  .tr-tabs button:hover{background:rgba(148,163,184,.1);transform:none;box-shadow:none}
  .tr-tabs button.on{background:linear-gradient(180deg,#4f8ff7,#2563eb);color:#fff;box-shadow:0 4px 12px -6px rgba(37,99,235,.9)}
  .tr-body{flex:1;min-height:0;display:flex}
  #trMain{flex:1;min-width:0;overflow:auto;padding:14px 22px 22px;display:flex;flex-direction:column;gap:14px}
  #trSide{width:390px;flex:0 0 390px;border-left:1px solid #1c2942;display:flex;flex-direction:column;min-height:0;background:#0b1426}
  #trPanel{flex:0 1 auto;max-height:62%;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #1c2942}
  #trPanel:empty{display:none}
  #trPanel .tr-explain, #trPanel .tr-advice{font-size:13px;padding:12px 13px}
  #trPanel .tr-opt b{min-width:0}
  #trPanel .tr-opt span{min-width:0}
  #trSpot{padding:12px 14px;border-bottom:1px solid #1c2942;font-size:12px;color:#9fb3cf;line-height:1.6}
  #trSpot b{color:#e2e8f0}
  #trFeed{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .tr-dim{color:#7f93b1;font-size:12px;line-height:1.5}
  .tr-msg{background:#0e1a30;border:1px solid #1f3152;border-left:3px solid #3b82f6;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:pre-wrap}
  .tr-msg.good{border-left-color:#22c55e}.tr-msg.ok{border-left-color:#eab308}.tr-msg.bad{border-left-color:#ef4444}
  .tr-msg b{display:block;font-size:12.5px;margin-bottom:2px;color:#e2e8f0}
  .tr-msg small{display:block;color:#6b7f9c;font-size:10.5px;margin-top:4px}
  .tr-felt-wrap{padding:84px 92px 88px}
  /* the table fits the window: as wide as there is room for, but never taller than the space left once the
     header, the seats around it and the action buttons are counted (about 400px) */
  .tr-felt{position:relative;width:min(100%, 860px, calc((100vh - 480px) * 2.05));min-width:min(100%, 520px);margin:0 auto;aspect-ratio:2.05/1;border-radius:999px;
    background:radial-gradient(ellipse at 50% 40%,#1f7a4d,#0f4d30 70%,#0b3b25);border:14px solid #4a2f1b;
    box-shadow:inset 0 0 0 3px #6b4426,inset 0 10px 40px rgba(0,0,0,.45),0 20px 50px -20px #000}
  .tr-seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2;min-width:120px}
  .tr-plate{background:#0b1220ee;border:1px solid #2a3b5c;border-radius:10px;padding:5px 10px;text-align:center;min-width:112px;box-shadow:0 6px 16px -6px #000}
  .tr-plate b{font-size:12.5px}
  .tr-plate .pos{margin-left:6px;font-size:10px;font-weight:800;color:#fbbf24}
  .tr-plate .stk{display:block;font-size:12px;color:#cbd5e1;font-variant-numeric:tabular-nums}
  .tr-plate small{display:block;font-size:9.5px;color:#7f93b1}
  .tr-seat.turn .tr-plate{border-color:#fbbf24;box-shadow:0 0 0 2px #fbbf2466,0 0 18px #fbbf2455}
  .tr-seat.folded{opacity:.45}
  .tr-seat.win .tr-plate{border-color:#22c55e;box-shadow:0 0 0 2px #22c55e66,0 0 20px #22c55e66}
  .tr-bubble{font-size:11px;background:#e2e8f0;color:#0f172a;border-radius:8px;padding:2px 8px;font-weight:700;white-space:nowrap}
  .tr-bubble.win{background:#22c55e;color:#04210f}
  .tr-cards{display:flex;gap:4px;min-height:60px;align-items:flex-end}
  .tc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:60px;border-radius:5px;background:#f8fafc;color:#0f172a;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.5);line-height:1;border:1px solid #cbd5e1;flex:0 0 auto}
  .tc b{font-size:21px}.tc i{font-style:normal;font-size:19px}
  .tc.lg{width:64px;height:90px;border-radius:7px}.tc.lg b{font-size:30px}.tc.lg i{font-size:27px}
  .tc.h{color:#dc2626}.tc.d{color:#2563eb}.tc.c{color:#15803d}
  .tc.back{background:repeating-linear-gradient(45deg,#1e3a8a 0 4px,#1e40af 4px 8px);border-color:#93c5fd}
  .tc.slot{background:rgba(0,0,0,.18);border:1px dashed rgba(255,255,255,.18);box-shadow:none}
  .tr-board{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);display:flex;gap:6px}
  .tr-pot{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);background:#0008;color:#fde68a;font-weight:800;padding:3px 12px;border-radius:99px;font-size:13px;white-space:nowrap}
  .tr-pot small{color:#cbd5e1;font-weight:500}
  .tr-bet{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:800;color:#fff;display:flex;align-items:center;gap:4px;z-index:1;text-shadow:0 1px 2px #000}
  .tr-bet::before{content:'';width:13px;height:13px;border-radius:99px;background:radial-gradient(circle,#fff 0 30%,#ef4444 32%);box-shadow:0 1px 3px #000}
  .tr-dealer{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:99px;background:#fff;color:#111;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px #000;z-index:1}
  .tr-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;background:#0b1424;border:1px solid #1c2942;border-radius:12px;padding:12px;min-height:62px}
  .tr-actions button{font-size:13.5px;padding:10px 16px}
  .tr-explain{border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;background:#0e1a30;border:1px solid #2a4066;display:flex;flex-direction:column;gap:8px}
  .tr-explain.good{background:#06261a;border-color:#167a4f}.tr-explain.ok{background:#241a06;border-color:#8a6212}.tr-explain.bad{background:#2a0b0b;border-color:#9b2c2c}
  .tr-explain > b{font-size:15px}
  .tr-explain small{color:#8ea2bd;font-size:11px}
  .tr-explain .tr-row{white-space:normal}
  .tr-why{white-space:pre-wrap;line-height:1.6}
  .tr-detail{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .tr-stattab{display:flex;flex-direction:column;gap:4px;white-space:normal}
  .tr-stattab > b{font-size:12.5px;color:#bfdbfe}
  .tr-stattab small{color:#8ea2bd;font-size:11px;line-height:1.45}
  .tr-tscroll{overflow-x:auto}
  .tr-stattab table{border-collapse:collapse;font-size:12px;width:100%;font-variant-numeric:tabular-nums}
  .tr-stattab th{text-align:left;color:#9fb3cf;font-weight:600;padding:4px 8px 4px 0;border-bottom:1px solid #2a3d5e;vertical-align:bottom}
  .tr-stattab td{padding:4px 8px 4px 0;border-bottom:1px solid #18263f;vertical-align:top}
  .tr-stattab td:not(:first-child),.tr-stattab th:not(:first-child){text-align:right}
  button.tr-mini{padding:5px 10px;font-size:11.5px}
  .tr-ratings{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
  .tr-histrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:#0e1a30;border:1px solid #1f3152;font-size:13px}
  .tr-histrow button{margin-left:auto}
  .tr-up{color:#6ee7b7;font-weight:700}.tr-down{color:#fca5a5;font-weight:700}
  .tr-replay-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .tr-narrate{background:#101c34;border-color:#35507e}
  .tr-narrate > b{font-size:15px;line-height:1.5;color:#e8f0fb}
  .tr-narrate details summary{cursor:pointer;color:#8ea2bd;font-size:12px}
  .tr-daily{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:#0e1a30;border:1px solid #2a4066}
  .tr-daily > b{font-size:14px}
  .tr-goal{display:grid;grid-template-columns:minmax(0,1fr) 140px 50px;gap:10px;align-items:center;font-size:12.5px}
  .tr-bar{height:8px;border-radius:99px;background:rgba(148,163,184,.15);overflow:hidden}
  .tr-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#22c58b,#4ade80)}
  .tr-goal small{color:#8ea2bd;text-align:right;font-variant-numeric:tabular-nums}
  .tr-goal.done span:first-child{color:#6ee7b7}
  .tr-rate{display:flex;align-items:baseline;gap:6px;padding:5px 10px;border-radius:10px;background:rgba(148,163,184,.07);border:1px solid rgba(148,163,184,.18)}
  .tr-rate.me{border-color:#3b82f6}
  .tr-rate em{font-style:normal;font-weight:800;font-size:15px;color:#fde68a;font-variant-numeric:tabular-nums}
  .tr-rate small{color:#8ea2bd}
  .tr-advice{border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.6;background:#0d1a33;border:1px solid #2f5aa8;display:flex;flex-direction:column;gap:10px}
  .tr-advice > b{font-size:15px;color:#bfdbfe}
  .tr-optlist{display:flex;flex-direction:column;gap:6px}
  .tr-opt{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:7px 10px;border-radius:10px;background:rgba(148,163,184,.06);border:1px solid rgba(148,163,184,.14)}
  .tr-opt b{min-width:140px}
  .tr-opt span{color:#cbd5e1;flex:1;min-width:200px}
  .tr-opt.best{border-color:#22c58b;background:rgba(34,197,139,.08)}
  .tr-tag{flex:0 0 auto !important;min-width:0 !important;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#6ee7b7 !important}
  .tr-msg .tr-why{margin-top:4px}
  b.tr-lbl, .tr-msg b.tr-lbl{display:inline;color:#fde68a;font-weight:700;font-size:inherit;margin:0}
  .tr-key{font-size:11.5px;color:#8ea2bd;line-height:1.6;text-align:center}
  .tr-key b{color:#cbd5e1;font-weight:700}
  .tr-learn details{background:#0e1a30;border:1px solid #1f3152;border-radius:12px;padding:0 14px}
  .tr-learn details[open]{border-color:#2f4c7a}
  .tr-learn summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:12px 0;font-size:14px;font-weight:700}
  .tr-learn summary::-webkit-details-marker{display:none}
  .tr-lnum{width:24px;height:24px;border-radius:99px;background:rgba(251,191,36,.15);color:#fde68a;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
  .tr-lbody{padding:0 0 14px;font-size:13.5px;line-height:1.65;color:#d5deea;max-width:72ch}
  .tr-lbody p{margin:0 0 10px}
  .tr-lbody b{color:#fff}
  .tr-formula{font-weight:700;color:#fde68a;background:rgba(251,191,36,.08);border-radius:8px;padding:8px 12px;display:inline-block}
  .tr-ltable{overflow-x:auto;margin:0 0 10px}
  .tr-ltable table{border-collapse:collapse;font-size:12.5px;min-width:100%}
  .tr-ltable th{text-align:left;color:#9fb3cf;font-weight:600;padding:6px 12px 6px 0;border-bottom:1px solid #2a3d5e}
  .tr-ltable td{padding:6px 12px 6px 0;border-bottom:1px solid #18263f;vertical-align:top}
  .tr-custom{display:flex;gap:6px;align-items:center}
  .tr-custom input{width:84px}
  .tr-wait{color:#94a3b8;font-style:italic}
  .tr-opts{display:flex;gap:18px;justify-content:center;font-size:12px;color:#8ea2bd;flex-wrap:wrap;align-items:center}
  .tr-opts label{display:flex;gap:6px;align-items:center}
  .tr-drill{max-width:800px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
  .tr-q{font-size:15px;line-height:1.6}
  .tr-q b{color:#fde68a}
  .tr-hand{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tr-sep{width:18px}
  .tr-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tr-row input[type=number]{width:110px}
  .tr-row input[type=range]{flex:1;min-width:200px}

  .tr-res{border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.55;background:#0e1a30;border:1px solid #1f3152;white-space:pre-wrap}
  .tr-res.good{border-color:#166534;background:#05230f}.tr-res.ok{border-color:#854d0e;background:#231705}.tr-res.bad{border-color:#7f1d1d;background:#260808}
  .tr-grid{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;max-width:640px}
  .tr-grid span{font-size:10.5px;font-weight:700;text-align:center;padding:6px 0;border-radius:3px;background:#1e293b;color:#64748b}
  .tr-grid span.r{background:#b91c1c;color:#fff}.tr-grid span.c{background:#15803d;color:#fff}
  .tr-grid span.me{outline:2px solid #fde047;outline-offset:-1px}
  .tr-legend{display:flex;gap:6px;align-items:center;font-size:12px;color:#9fb3cf;flex-wrap:wrap}
  .tr-legend span{display:inline-block;width:12px;height:12px;border-radius:3px;background:#1e293b;margin-left:8px}
  .tr-legend span.r{background:#b91c1c}.tr-legend span.c{background:#15803d}
  .tr-views button{font-size:11.5px;padding:5px 10px}
  .tr-views button.on{background:linear-gradient(180deg,#4f8ff7,#2563eb);border-color:transparent;color:#fff}
  .tr-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .tr-stat{background:#0e1a30;border:1px solid #1f3152;border-radius:10px;padding:10px 12px}
  .tr-stat small{display:block;color:#7f93b1;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
  .tr-stat b{font-size:20px}
  .tr-sd{display:flex;gap:12px;flex-wrap:wrap}
  .tr-sd button{display:flex;flex-direction:column;gap:6px;align-items:center;padding:10px 12px}
  .tr-sd button.tr-win{box-shadow:0 0 0 2px #22c55e}
  .tr-sd small{color:#cbd5e1;font-weight:500}
  .tr-room{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#0e1a30;border:1px solid #24406b;border-radius:10px;padding:8px 12px;font-size:12.5px}
  .tr-room b{color:#fde68a}
  .tr-room label{display:flex;gap:6px;align-items:center;color:#cbd5e1}
  .tr-code{font-size:26px;letter-spacing:.18em;color:#fde68a;font-family:ui-monospace,Consolas,monospace}
  .tr-plate small.tr-human{color:#93c5fd}
  .tr-plate small.tr-chips{color:#94a3b8}
  .tr-seat.out{opacity:.4}
  .tr-tour{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#1c1606;border:1px solid #854d0e;border-radius:10px;padding:8px 12px;font-size:12.5px;color:#fde68a}
  .tr-tour b{color:#fde68a}
  .tr-row label.tr-dim{display:flex;gap:6px;align-items:center}
  .tr-pfgrid span{display:flex;flex-direction:column;line-height:1.1;padding:3px 0}
  .tr-pfgrid span em{font-style:normal;font-size:11px;font-weight:800;color:#fff;min-height:12px}
  .tr-pfgrid span.p1{background:#3f1d1d;color:#fca5a5}.tr-pfgrid span.p2{background:#7f1d1d;color:#fecaca}
  .tr-pfgrid span.p3{background:#b91c1c;color:#fff}.tr-pfgrid span.p4{background:#dc2626;color:#fff}
  table.tr-icmt{border-collapse:collapse;font-size:13px;max-width:520px}
  table.tr-icmt th{color:#7f93b1;font-weight:600;text-align:left;padding:4px 12px 4px 0;border-bottom:1px solid #1f3152}
  table.tr-icmt td{padding:4px 12px 4px 0;border-bottom:1px solid #142036}
  table.tr-icmt tr.me td{color:#fde68a;font-weight:700}
  @media (max-width: 1150px){ .tr-body{flex-direction:column} #trSide{width:auto;flex:0 0 300px;border-left:none;border-top:1px solid #1c2942} .tr-felt-wrap{padding:52px 70px 70px} }


  /* toast */
  .toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom, 0px));right:calc(16px + env(safe-area-inset-right, 0px));background:#0f172a;border:1px solid var(--border);color:#fff;padding:10px 14px;border-radius:10px;font-weight:600;opacity:0;transform:translateY(8px);transition:.25s;z-index:50;pointer-events:none;max-width:min(460px, calc(100vw - 32px))}
  .toast.show{opacity:1;transform:none}
  .toast.green{border-color:#059669}.toast.red{border-color:#e11d48}
  /* the web page scrolls as a whole */

  let _toastTimer = null;
  function toast(msg, kind) {
